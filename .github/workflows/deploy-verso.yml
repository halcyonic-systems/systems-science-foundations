name: Deploy Verso to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/verso/**'
      - 'Systems/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          build-args: ""

      - name: Build Verso document
        run: |
          cd docs/verso
          lake exe proposal

      - name: Inject Halcyonic theme
        run: |
          cd docs/verso
          cp halcyonic-theme.css _out/html-multi/
          find _out/html-multi -name "index.html" -exec sed -i 's|</head>|<link rel="stylesheet" href="/halcyonic-theme.css"></head>|' {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/verso/_out/html-multi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
