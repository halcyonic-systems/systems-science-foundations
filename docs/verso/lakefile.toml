name = "systems-proposal"
defaultTargets = ["SystemsProposal", "proposal"]

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.28.0"

[[require]]
name = "systems-ontology"
path = "../.."

[[lean_lib]]
name = "SystemsProposal"

[[lean_lib]]
name = "BuildingStory"

[[lean_exe]]
name = "proposal"
root = "SystemsProposalMain"

[[lean_exe]]
name = "building-story"
root = "BuildingStoryMain"
