<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="ahb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f6fb0"/>
    </marker>
    <marker id="ahg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa3ad"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#ffffff"/>

  <!-- Walking arrow K, top center -->
  <text x="380" y="38" text-anchor="middle" font-size="16" font-weight="600" fill="#2f6fb0">K  ≅  2   ·   the walking arrow</text>
  <circle cx="330" cy="78" r="9" fill="#2f6fb0"/>
  <circle cx="430" cy="78" r="9" fill="#2f6fb0"/>
  <line x1="342" y1="78" x2="416" y2="78" stroke="#2f6fb0" stroke-width="2.4" marker-end="url(#ahb)"/>
  <text x="330" y="108" text-anchor="middle" font-size="12" fill="#555">source</text>
  <text x="430" y="108" text-anchor="middle" font-size="12" fill="#555">sink</text>

  <!-- faithful functor arrows -->
  <line x1="345" y1="120" x2="150" y2="250" stroke="#9aa3ad" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ahg)"/>
  <line x1="380" y1="120" x2="380" y2="250" stroke="#9aa3ad" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ahg)"/>
  <line x1="415" y1="120" x2="610" y2="250" stroke="#9aa3ad" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#ahg)"/>
  <text x="250" y="180" text-anchor="middle" font-size="12" font-style="italic" fill="#7a828c" transform="rotate(-33 250 180)">faithful functor</text>

  <!-- Klir shape -->
  <text x="150" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Klir</text>
  <circle cx="110" cy="360" r="8" fill="#1a1a1a"/>
  <circle cx="190" cy="320" r="8" fill="#1a1a1a"/>
  <line x1="182" y1="326" x2="118" y2="354" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="110" y="384" text-anchor="middle" font-size="11.5" fill="#444">things</text>
  <text x="190" y="312" text-anchor="middle" font-size="11.5" fill="#444">relations</text>

  <!-- Mobus shape -->
  <text x="380" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Mobus (8-tuple)</text>
  <circle cx="345" cy="320" r="7" fill="#1a1a1a"/>
  <circle cx="345" cy="380" r="7" fill="#1a1a1a"/>
  <circle cx="415" cy="350" r="7" fill="#1a1a1a"/>
  <line x1="345" y1="327" x2="345" y2="373" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="352" y1="324" x2="408" y2="346" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="408" y1="354" x2="352" y2="376" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="380" y="404" text-anchor="middle" font-size="11" font-style="italic" fill="#7a828c">a richer shape, still containing the arrow</text>

  <!-- Joslyn shape (cycle) -->
  <text x="610" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Joslyn (feedback)</text>
  <circle cx="575" cy="350" r="8" fill="#1a1a1a"/>
  <circle cx="645" cy="350" r="8" fill="#1a1a1a"/>
  <path d="M583,344 Q610,326 637,344" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M637,356 Q610,374 583,356" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/>
  <text x="575" y="384" text-anchor="middle" font-size="11" fill="#444">controller</text>
  <text x="645" y="384" text-anchor="middle" font-size="11" fill="#444">effector</text>

</svg>
