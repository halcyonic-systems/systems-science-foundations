<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2f6fb0"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9aa3ad"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#ffffff"/>

  <!-- four protocol columns -->
  <!-- positions: centers at 95, 285, 475, 665 -->
  <g font-size="13" fill="#1a1a1a">
    <text x="95"  y="46" text-anchor="middle" font-weight="600">TCP/IP</text>
    <text x="285" y="46" text-anchor="middle" font-weight="600">Bitcoin</text>
    <text x="475" y="46" text-anchor="middle" font-weight="600">REST API</text>
    <text x="665" y="46" text-anchor="middle" font-weight="600">Hand-washing</text>
  </g>
  <g font-size="11" fill="#888">
    <text x="95"  y="64" text-anchor="middle">networking</text>
    <text x="285" y="64" text-anchor="middle">consensus</text>
    <text x="475" y="64" text-anchor="middle">software interface</text>
    <text x="665" y="64" text-anchor="middle">public health</text>
  </g>

  <!-- each: two dots + arrow -->
  <g>
    <!-- TCP/IP -->
    <circle cx="55" cy="105" r="7" fill="#1a1a1a"/><circle cx="135" cy="105" r="7" fill="#1a1a1a"/>
    <line x1="63" y1="105" x2="125" y2="105" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="55"  y="130" text-anchor="middle" font-size="11" fill="#444">sender</text>
    <text x="135" y="130" text-anchor="middle" font-size="11" fill="#444">receiver</text>
    <!-- Bitcoin -->
    <circle cx="245" cy="105" r="7" fill="#1a1a1a"/><circle cx="325" cy="105" r="7" fill="#1a1a1a"/>
    <line x1="253" y1="105" x2="315" y2="105" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="245" y="130" text-anchor="middle" font-size="11" fill="#444">tx</text>
    <text x="325" y="130" text-anchor="middle" font-size="11" fill="#444">ledger</text>
    <!-- REST -->
    <circle cx="435" cy="105" r="7" fill="#1a1a1a"/><circle cx="515" cy="105" r="7" fill="#1a1a1a"/>
    <line x1="443" y1="105" x2="505" y2="105" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="435" y="130" text-anchor="middle" font-size="11" fill="#444">request</text>
    <text x="515" y="130" text-anchor="middle" font-size="11" fill="#444">response</text>
    <!-- Hand-washing -->
    <circle cx="625" cy="105" r="7" fill="#1a1a1a"/><circle cx="705" cy="105" r="7" fill="#1a1a1a"/>
    <line x1="633" y1="105" x2="695" y2="105" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#a)"/>
    <text x="625" y="130" text-anchor="middle" font-size="11" fill="#444">dirty</text>
    <text x="705" y="130" text-anchor="middle" font-size="11" fill="#444">clean</text>
  </g>

  <!-- convergence lines down to the single morphism -->
  <line x1="95"  y1="150" x2="360" y2="285" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ag)"/>
  <line x1="285" y1="150" x2="372" y2="285" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ag)"/>
  <line x1="475" y1="150" x2="388" y2="285" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ag)"/>
  <line x1="665" y1="150" x2="400" y2="285" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ag)"/>

  <!-- the one morphism -->
  <text x="380" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#2f6fb0">one morphism</text>
  <circle cx="330" cy="352" r="9" fill="#2f6fb0"/>
  <circle cx="430" cy="352" r="9" fill="#2f6fb0"/>
  <line x1="342" y1="352" x2="416" y2="352" stroke="#2f6fb0" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="380" y="392" text-anchor="middle" font-size="13" fill="#2f6fb0">K  ≅  2</text>

</svg>
